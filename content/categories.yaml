# Sidebar manifest for the Codex.
#
# Two-level hierarchy:
#   - sections (top-level domain — "Zendesk Guide", "Integrations", ...)
#     - categories (sub-areas within a section — "Header & nav", "Requests")
#       - items (ordered snippet ids — filenames without `.md`)
#
# Sections without any non-empty categories don't render in the sidebar.
# Categories without any items don't render either. So you can declare a
# section ahead of having content for it; the structure shows up once a
# snippet is added.
#
# Adding a snippet means: drop the .md file under content/<category>/ AND
# add its id to the matching category's `items` list below.

- section: getting-started
  label: Getting started
  categories:
    - id: getting-started
      label: Getting started
      items:
        - introduction
        - how-to-use

- section: zendesk-guide
  label: Zendesk Guide
  categories:
    - id: header
      label: Header & nav
      items:
        - remove-signin-options
    - id: requests
      label: Request form
      items:
        - restrict-to-requests-only
        - hide-form-fields
    - id: footer
      label: Footer
      items: []
    - id: homepage
      label: Home page
      items: []
    - id: categories
      label: Categories
      items: []
    - id: sections
      label: Sections
      items: []
    - id: articles
      label: Articles
      items:
        - dynamic-content-placeholders
    - id: custom
      label: Custom pages
      items: []

- section: integrations
  label: Integrations
  categories:
    - id: sunshine
      label: Sunshine Conversations
      items:
        - switchboard-via-postman
    - id: webhooks
      label: Webhooks
      items: []

- section: workflows
  label: Internal workflows
  categories:
    - id: debugging
      label: Customer debugging
      items: []
