# Sidebar categories for the Codex.
# - `id` matches the folder name under content/.
# - `label` is the human-readable name shown in the sidebar.
# - `items` is the ordered list of snippet ids inside that category.
#   Adding a snippet means: drop the .md AND add its id here.

